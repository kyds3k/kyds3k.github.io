<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Game</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141824">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Play&family=Titillium+Web&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="game.css">
  <script type="module" src="gate.js"></script>
</head>

<body class="blue">
  <main id="app" class="game">
    <form class="gate card notch-right" hidden>
      <h1>Movie Game</h1>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="cta" type="submit">Enter</button>
      <p class="gate-error" role="alert"></p>
    </form>
  </main>
</body>
</html>
